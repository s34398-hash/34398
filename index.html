<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าแรก - Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Prompt', sans-serif; }
        body { background-color: #fffde7; color: #333; }
        
        header { position: fixed; top: 0; left: 0; width: 100%; background: rgba(255, 255, 255, 0.95); box-shadow: 0 4px 15px rgba(230, 180, 0, 0.15); z-index: 1000; backdrop-filter: blur(5px); }
        nav { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; padding: 1rem 2rem; }
        .logo { font-size: 1.5rem; font-weight: 700; color: #d48806; text-shadow: 1px 1px 2px rgba(0,0,0,0.1); }
        .nav-links { display: flex; list-style: none; gap: 1.5rem; }
        .nav-links a { text-decoration: none; color: #555; font-weight: 500; transition: all 0.3s; padding: 0.3rem 0.8rem; border-radius: 20px; }
        .nav-links a:hover, .nav-links a.active { color: #855800; background-color: #ffe58f; font-weight: 700; }

        .hero { min-height: 100vh; background: linear-gradient(135deg, #fff1b8 0%, #ffe58f 50%, #ffd666 100%); display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 6rem 1rem 2rem; }
        .profile-img { width: 220px; height: 220px; object-fit: cover; border-radius: 50%; box-shadow: 0 10px 25px rgba(212, 136, 6, 0.3); margin-bottom: 1.5rem; border: 5px solid #ffffff; transition: transform 0.4s ease; }
        .profile-img:hover { transform: scale(1.05) rotate(2deg); }
        .hero h1 { font-size: 2.8rem; color: #613b00; margin-bottom: 0.8rem; text-shadow: 2px 2px 4px rgba(255,255,255,0.6); }
        .hero p { font-size: 1.3rem; color: #855800; font-weight: 500; background: rgba(255,255,255,0.6); padding: 0.5rem 1.5rem; border-radius: 30px; }
        .decoration-emoji { font-size: 2.5rem; margin: 0 0.5rem; vertical-align: middle; }

        @media (max-width: 768px) {
            .profile-img { width: 170px; height: 170px; }
            .hero h1 { font-size: 1.8rem; }
            .hero p { font-size: 1rem; }
            .nav-links { gap: 0.5rem; font-size: 0.8rem; }
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <div class="logo">🌴 PORTFOLIO 🌴</div>
            <ul class="nav-links">
                <li><a href="index.html" class="active">🏠 หน้าแรก</a></li>
                <li><a href="about.html">👤 ข้อมูลส่วนตัว</a></li>
                <li><a href="goals.html">🎯 เป้าหมาย</a></li>
                <li><a href="portfolio.html">📜 ผลงาน</a></li>
                <li><a href="contact.html">📞 ติดต่อ</a></li>
            </ul>
        </nav>
    </header>

    <div class="hero">
        <img src="โครตกาก.jpeg" alt="ปุณณวิช ทนงศิลป์" class="profile-img">
        <h1><span class="decoration-emoji">🌴</span>WELCOME TO MY PORTFOLIO<span class="decoration-emoji">☀️</span></h1>
        <p>ยินดีต้อนรับสู่แฟ้มสะสมผลงานของ ปุณณวิช ทนงศิลป์ 🥥✨</p>
    </div>

</body>
</html>
